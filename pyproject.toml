[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-business-harness"
version = "0.1.0"
description = "A provider-neutral operating harness for AI-native businesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HERMES OS" }]
dependencies = []

[project.scripts]
hermes = "hermes_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
